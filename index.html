<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trade Lab OS</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f172a">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Inter,system-ui,sans-serif}
body{background:#f1f5f9;color:#0f172a}
header{background:#0f172a;color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
.container{max-width:820px;margin:0 auto;padding:12px}
.card{background:#fff;border-radius:12px;border:1px solid #e2e8f0;overflow:hidden;margin-bottom:12px}
.toolbar{display:flex;gap:6px;padding:10px;background:#f8fafc;border-bottom:1px solid #e2e8f0;flex-wrap:wrap}
.tbtn{padding:6px 10px;border:1px solid #cbd5e1;border-radius:6px;background:#fff;cursor:pointer;font-size:13px;flex:0 0 auto;min-width:52px}
.tbtn:active{background:#e2e8f0}
#editor{min-height:320px;padding:16px;outline:none;line-height:1.6}
#editor h2{font-size:18px;margin:14px 0 6px;border-bottom:2px solid #0f172a;padding-bottom:4px}
#editor ul, #editor ol{margin:8px 0 8px 24px}
.controls{display:flex;gap:8px;flex-wrap:wrap;padding:12px}
.btn{padding:10px 14px;border-radius:8px;border:0;cursor:pointer;font-weight:600}
.btn-dark{background:#0f172a;color:#fff}
.btn-light{background:#e2e8f0}
.screenshots{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px}
.screenshots img{width:100%;border-radius:8px;border:1px solid #e2e8f0}
input[type=file]{padding:12px}
</style>
</head>
<body>
<header>
  <div><b>Trade Lab OS</b> — TRADE JOURNAL</div>
  <input type="date" id="journalDate">
</header>
<div class="container">
  <div class="card">
    <div style="padding:10px;display:flex;gap:8px;flex-wrap:wrap;border-bottom:1px solid #e2e8f0">
      <select id="bias"><option>Bullish Bias</option><option>Bearish Bias</option><option>Neutral / No Trade</option></select>
      <span id="saveStatus" style="font-size:12px;color:#64748b">Saved</span>
    </div>
    <div class="toolbar">
      <button class="tbtn" data-cmd="bold"><b>B</b></button>
      <button class="tbtn" data-cmd="italic"><i>I</i> Italic</button>
      <button class="tbtn" data-cmd="formatBlock" data-val="h2">H2</button>
      <button class="tbtn" data-cmd="indent">→</button>
      <button class="tbtn" data-cmd="outdent">←</button>
      <button class="tbtn" data-cmd="fontSize" data-val="4">A+</button>
      <button class="tbtn" data-cmd="fontSize" data-val="2">A-</button>
      <button class="tbtn" data-cmd="insertUnorderedList">UList</button>
      <button class="tbtn" data-cmd="insertOrderedList">OList</button>
      <button class="tbtn" data-cmd="removeFormat">Clear</button>
    </div>
    <div id="editor" contenteditable="true"><h2>Confluence</h2><div>Start typing...</div></div>
  </div>
  <div class="card">
    <div style="padding:12px;font-weight:700">Chart Screenshots</div>
    <input type="file" id="shotInput" accept="image/*" multiple>
    <div id="shotPreview" class="screenshots"></div>
  </div>
  <div class="controls">
    <button class="btn btn-dark" id="exportBtn">Export PDF</button>
    <button class="btn btn-light" id="clearBtn">Clear Day</button>
  </div>
</div>
<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script>
const editor=document.getElementById('editor');
const journalDate=document.getElementById('journalDate');
const bias=document.getElementById('bias');
const saveStatus=document.getElementById('saveStatus');
const shotInput=document.getElementById('shotInput');
const shotPreview=document.getElementById('shotPreview');
let screenshots=[];
if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js');}
const today=new Date().toISOString().split('T')[0];
journalDate.value=today;
function key(){return 'tradelab_'+journalDate.value;}
function save(){localStorage.setItem(key(),JSON.stringify({html:editor.innerHTML,bias:bias.value,shots:screenshots}));saveStatus.textContent='Saved '+new Date().toLocaleTimeString();}
function load(){const raw=localStorage.getItem(key());if(!raw){editor.innerHTML='<h2>Confluence</h2><div>Start typing...</div>';screenshots=[];renderShots();return;}try{const d=JSON.parse(raw);editor.innerHTML=d.html||'';bias.value=d.bias||'Bullish Bias';screenshots=d.shots||[];renderShots();}catch(e){}}
function renderShots(){shotPreview.innerHTML='';screenshots.forEach(src=>{const img=document.createElement('img');img.src=src;shotPreview.appendChild(img);});}
shotInput.addEventListener('change',async(e)=>{for(let f of e.target.files){const data=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(f);});screenshots.push(data);}renderShots();save();});
editor.addEventListener('input',save);
bias.addEventListener('change',save);
journalDate.addEventListener('change',load);
document.querySelector(".toolbar").addEventListener("click",(e)=>{const btn=e.target.closest(".tbtn");if(!btn)return;editor.focus();const cmd=btn.dataset.cmd;const val=btn.dataset.val||null;if(cmd==="formatBlock"){document.execCommand(cmd,false,"<"+val+">");}else if(cmd==="fontSize"){document.execCommand(cmd,false,val);}else{document.execCommand(cmd,false,null);}save();});
document.getElementById('exportBtn').addEventListener('click',async()=>{const{PDFDocument,rgb,StandardFonts}=PDFLib;const pdf=await PDFDocument.create();const font=await pdf.embedFont(StandardFonts.Helvetica);const bold=await pdf.embedFont(StandardFonts.HelveticaBold);const italic=await pdf.embedFont(StandardFonts.HelveticaOblique);const boldItalic=await pdf.embedFont(StandardFonts.HelveticaBoldOblique);const PAGE_W=595.28,PAGE_H=841.89,MARGIN=32,CONTENT_W=PAGE_W-MARGIN*2;let page,y;function newPage(){const p=pdf.addPage([PAGE_W,PAGE_H]);p.drawText(`${journalDate.value} - US500 JOURNAL - ${bias.value}`,{x:MARGIN,y:PAGE_H-26,size:9,font:bold,color:rgb(0.4,0.4,0.4)});p.drawLine({start:{x:MARGIN,y:PAGE_H-32},end:{x:PAGE_W-MARGIN,y:PAGE_H-32},thickness:0.5,color:rgb(0.88,0.88,0.88)});return p;}page=newPage();y=800;page.drawText(bias.value,{x:MARGIN,y,size:14,font:bold});y-=24;const temp=document.createElement('div');temp.innerHTML=editor.innerHTML;const lines=[];function walk(node,styles={b:false,i:false,h2:false,fs:12,indent:0}){if(node.nodeType===3){const txt=node.textContent.replace(/\s+/g,' ').trim();if(txt)lines.push({...styles,text:txt});return;}if(node.nodeType!==1)return;let ns={...styles};const tag=node.tagName;if(tag==='B'||tag==='STRONG')ns.b=true;if(tag==='I'||tag==='EM')ns.i=true;if(tag==='H2'){ns.h2=true;ns.b=true;ns.fs=14;}if(tag==='FONT'&&node.getAttribute('size')==='4')ns.fs=15;if(tag==='FONT'&&node.getAttribute('size')==='2')ns.fs=11;if(tag==='BLOCKQUOTE'||node.style.marginLeft)ns.indent=(ns.indent||0)+16;for(let c of node.childNodes)walk(c,ns);if(tag==='DIV'||tag==='P'||tag==='H2'||tag==='LI'||tag==='BR')lines.push({break:true});}walk(temp);for(let ln of lines){if(ln.break){y-=ln.h2?10:6;continue;}if(!ln.text)continue;if(y<50){page=newPage();y=800;}let f=font;if(ln.b&&ln.i)f=boldItalic;else if(ln.b)f=bold;else if(ln.i)f=italic;const size=ln.fs||12;const x=MARGIN+(ln.indent||0);const maxW=CONTENT_W-(ln.indent||0);let cur='';for(let word of ln.text.split(' ')){const test=cur?cur+' '+word:word;if(f.widthOfTextAtSize(test,size)>maxW){page.drawText(cur,{x,y,size,font:f});y-=size+4;if(y<50){page=newPage();y=800;}cur=word;}else cur=test;}if(cur){page.drawText(cur,{x,y,size,font:f});y-=size+6;}}y-=12;for(let i=0;i<screenshots.length;i++){try{const base64=screenshots[i].split(",")[1];const bytes=Uint8Array.from(atob(base64),c=>c.charCodeAt(0));const img=await pdf.embedJpg(bytes).catch(async()=>await pdf.embedPng(bytes));let w=CONTENT_W;let h=(img.height/img.width)*w;const PAGE_USABLE=760;const SPACE_NEEDED=h+20;if(h>PAGE_USABLE){h=PAGE_USABLE;w=(img.width/img.height)*h;}if(y-SPACE_NEEDED<36){page=newPage();y=800;}page.drawText(`Screenshot ${i+1}/${screenshots.length}`,{x:MARGIN,y,size:9,font:bold,color:rgb(0.5,0.55,0.65)});y-=14;const x=MARGIN+(CONTENT_W-w)/2;page.drawImage(img,{x,y:y-h,width:w,height:h});y-=h+28;}catch(e){}}const bytes=await pdf.save();const blob=new Blob([bytes],{type:'application/pdf'});const url=URL.createObjectURL(blob);window.open(url,'_blank');});
document.getElementById('clearBtn').addEventListener('click',()=>{if(confirm('Clear this day?')){localStorage.removeItem(key());load();}});
load();
</script>
</body>
</html>
